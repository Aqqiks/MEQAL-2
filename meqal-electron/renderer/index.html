<!DOCTYPE html>
<!-- MEQAL VALVE CONTROL — RENDERER ENTRY POINT -->
<!-- This is the main HTML document loaded by the Electron BrowserWindow. It defines the full UI layout, -->
<!-- -> loads Chart.js from CDN, applies the dark-mode stylesheet, and bootstraps the renderer script. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- CSP restricts script sources to self and the Chart.js CDN; fonts are loaded from Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
<title>MEQAL Valve Control</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* CSS VARIABLES
     Global design tokens for the dark theme — background layers, border shades, semantic colours,
     typography families, and the shared border-radius. All colours reference these variables. */
  :root {
    --bg-deep:    #07090d;
    --bg-panel:   #0e1318;
    --bg-card:    #121920;
    --bg-hover:   #1a2330;
    --border:     #1e2d3d;
    --border-hi:  #2a3f55;
    --green:      #22c55e;
    --green-dim:  #16a34a;
    --green-glow: rgba(34,197,94,0.15);
    --red:        #ef4444;
    --red-dim:    #b91c1c;
    --amber:      #f59e0b;
    --blue:       #3b82f6;
    --text-1:     #e2eaf4;
    --text-2:     #7a8fa8;
    --text-3:     #3d5268;
    --mono:       'JetBrains Mono', monospace;
    --sans:       'DM Sans', sans-serif;
    --radius:     10px;
  }

  /* RESET — strip browser default margins and set border-box sizing globally */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* BODY
     Full-viewport column flex container. Overflow hidden prevents scrollbars on the root level;
     individual scrollable regions opt in themselves. user-select none prevents accidental text selection on click. */
  body {
    font-family: var(--sans);
    background: var(--bg-deep);
    color: var(--text-1);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* TITLEBAR
     Fixed-height drag region at the top of the window. The -webkit-app-region: drag lets the user
     move the window by clicking anywhere in this bar; interactive children override it with no-drag. */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 48px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  /* Left side of the titlebar contains the logo mark and application title text. */
  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Small gradient square that serves as the application logo mark */
  .logo-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--green) 0%, #16a34a 100%);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: #000;
    letter-spacing: -0.5px;
  }
  /* Application title text in the titlebar */
  .app-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-1);
  }

  /* Right side of titlebar contains the live status badge; no-drag so badge text can be selected if needed */
  .titlebar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    -webkit-app-region: no-drag;
  }
  /* Live badge: small status indicator showing a coloured dot and text ("LIVE" when running, "IDLE" when stopped) */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-2);
  }

  /* Animated green dot shown in the titlebar when the system is running; becomes a static grey dot when idle */
  .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 var(--green-glow);
    animation: pulse-ring 2s infinite;
  }
  /* When the system is stopped, the pulse-dot loses its animation and glow, and turns grey. */
  .pulse-dot.stopped { background: var(--text-3); animation: none; box-shadow: none; }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  /* TOOLBAR
     Horizontal strip of action buttons and dropdowns below the titlebar.
     Toolbar separators (.toolbar-sep) provide visual grouping between related controls. */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* Base button style — shared by all toolbar buttons */
  .btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    -webkit-app-region: no-drag;
    white-space: nowrap;
  }
  /* Hover state for all buttons: slightly lighter background and brighter border */
  .btn:hover { background: var(--bg-hover); border-color: var(--border-hi); }

  /* Green-accented primary button used for the Start action */
  .btn-primary {
    background: var(--green-dim);
    border-color: var(--green);
    color: #fff;
  }
  .btn-primary:hover { background: var(--green); }

  /* Red-accented danger button used for the Emergency Stop action */
  .btn-danger {
    background: var(--red-dim);
    border-color: var(--red);
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .btn-danger:hover { background: var(--red); }

  /* Amber-tinted button style shown when a timed run is in progress */
  .btn-running {
    background: rgba(245,158,11,0.15);
    border-color: var(--amber);
    color: var(--amber);
  }

  /* Blue-tinted button style toggled on when random mode or random caps mode is active */
  .btn-random-on {
    background: rgba(59,130,246,0.15);
    border-color: var(--blue);
    color: var(--blue);
  }
  /* Toolbar separator: a thin vertical line that visually groups related controls in the toolbar. */
  .toolbar-sep {
    width: 1px;
    height: 28px;
    background: var(--border);
    margin: 0 4px;
  }

  /* Shared style for the area and time select dropdowns in the toolbar */
  .row-select {
    padding: 7px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  /* MAIN LAYOUT
     Two-column grid: the left panel holds the charts (flexible width), the right sidebar is fixed at 320px. */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL
     Vertically scrollable column containing the flow charts. overflow-y: auto allows the charts to scroll
     if the window is too short to show them all at once. */
  .left-panel {
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 14px;
    overflow-y: auto !important;
  }

  /* Shared card style used as a container for charts and labelled sections */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  /* Small monospace uppercase label displayed above each chart or data section */
  .panel-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* Fixed-height wrapper that constrains the main flow rate chart canvas */
  .chart-wrap {
    height: 300px;
  }

  /* Force Chart.js canvases to fill their wrapper div entirely */
  .chart-wrap canvas,
  .valve-chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* Fixed-height wrapper for the per-valve cumulative flow bar chart */
  .valve-chart-wrap {
    height: 250px;
  }

  /* RIGHT SIDEBAR
     Fixed-width scrollable column containing the total flow card, valve grid, and mini sparkline chart. */
  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px;
    gap: 14px;
  }

  /* TOTAL FLOW CARD
     Prominent centred display of the cumulative total flow in litres with two smaller stat boxes below it. */
  .total-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  /* Large green monospace number showing the total accumulated litres */
  .total-value {
    font-family: var(--mono);
    font-size: 44px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
    transition: color 0.3s;
  }

  .total-unit {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
  }

  /* Two-column grid beneath the total showing active valve count and instantaneous flow rate */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .stat-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-1);
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* VALVE GRID CARD
     Contains the 7×7 CSS grid of clickable valve boxes. flex: 1 allows it to stretch within the sidebar. */
  .valve-grid-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    flex: 1;
  }

  /* 7×7 CSS grid that maps 1:1 to the physical valve layout; aspect-ratio keeps it square */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 4px;
    aspect-ratio: 1 / 1;
    width: 100%;
  }

  /* Individual valve box — idle state */
  .box {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    background: #1a2433;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, color 0.15s;
    aspect-ratio: 1;
  }
  /* Hover state for valve boxes: slightly lighter background and brighter border; text becomes more visible. */
  .box:hover {
    background: var(--bg-hover);
    border-color: var(--border-hi);
    color: var(--text-1);
  }

  /* Green glowing state — valve is selected and currently open */
  .box.online {
    background: var(--green-dim);
    border-color: var(--green);
    color: #fff;
    box-shadow: 0 0 8px rgba(34,197,94,0.4);
  }

  /* Red-tinted state — valve was active during an emergency stop */
  .box.offline {
    background: #2a1010;
    border-color: var(--red-dim);
    color: rgba(239,68,68,0.5);
  }

  /* Amber state — valve has reached its cumulative flow cap and has been deactivated */
  .box.done {
    background: rgba(245,158,11,0.12);
    border-color: var(--amber);
    color: var(--amber);
  }

  /* MINI FLOW CHART — compact sparkline in the sidebar showing the total flow curve */
  .mini-chart-wrap {
    height: 80px;
    margin-top: 10px;
  }

  /* STATUS BAR
     Fixed-height footer bar showing the system status text, current time, and CAN bus connection indicator. */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 16px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    flex-shrink: 0;
  }

  .statusbar-item { display: flex; align-items: center; gap: 6px; }

  /* Small coloured dot indicating CAN bus connection state: green = connected, red = no CAN */
  .can-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-3);
  }
  .can-dot.ok  { background: var(--green); }
  .can-dot.err { background: var(--red); }

  /* TOAST
     Temporary notification that slides up from the bottom-right corner. Shown for 3 seconds.
     pointer-events: none ensures it doesn't block clicks on the UI beneath it. */
  #toast {
    position: fixed;
    bottom: 36px;
    right: 20px;
    background: var(--bg-hover);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-1);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* FLOW CAP INPUT — narrow number input in the toolbar for setting the per-valve flow cap in decilitres */
  .toolbar-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    white-space: nowrap;
    letter-spacing: 0.06em;
  }

  .flow-cap-input {
    width: 64px;
    padding: 7px 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--mono);
    font-size: 12px;
    -webkit-app-region: no-drag;
  }

  .flow-cap-input:focus {
    outline: none;
    border-color: var(--amber);
  }

  /* EMERGENCY FLASH — brief red body flash triggered when the emergency stop button is pressed */
  @keyframes emergency-flash {
    0%, 100% { background: var(--bg-deep); }
    50%       { background: rgba(239,68,68,0.06); }
  }
  body.emergency { animation: emergency-flash 0.4s ease 3; }

</style>
</head>
<body>

<!-- TITLEBAR
     Draggable top bar containing the MEQAL logo, application title, and the live running status badge. -->
<div class="titlebar">
  <div class="titlebar-left">
    <div class="logo-mark">MQ</div>
    <span class="app-title">MEQAL Valve Control System</span>
  </div>
  <div class="titlebar-right">
    <!-- Pulse dot animates green when running; becomes static grey when idle -->
    <div class="live-badge">
      <div class="pulse-dot" id="pulseDot"></div>
      <span id="sysStatus">IDLE</span>
    </div>
  </div>
</div>

<!-- TOOLBAR
     Action strip with start/stop controls, area and time selectors, mode toggles, and the emergency stop.
     Separator divs (.toolbar-sep) visually group related controls. -->
<div class="toolbar">
  <button class="btn btn-primary" id="startBtn">▶ Start</button>
  <button class="btn" id="stopBtn">■ Stop</button>
  <div class="toolbar-sep"></div>

  <!-- Area select: choose a row (horizontal) or column (vertical) of valves to activate at once -->
  <select class="row-select" id="areaSelect">
    <option value="" disabled selected>Select area…</option>
    <optgroup label="Rows — 1×7 (horizontal)">
      <option value="row-1">Row 1  (1–7)</option>
      <option value="row-2">Row 2  (8–14)</option>
      <option value="row-3">Row 3  (15–21)</option>
      <option value="row-4">Row 4  (22–28)</option>
      <option value="row-5">Row 5  (29–35)</option>
      <option value="row-6">Row 6  (36–42)</option>
      <option value="row-7">Row 7  (43–49)</option>
    </optgroup>
    <optgroup label="Columns — 7×1 (vertical)">
      <option value="col-1">Col 1  (1,8,15,22,29,36,43)</option>
      <option value="col-2">Col 2  (2,9,16,23,30,37,44)</option>
      <option value="col-3">Col 3  (3,10,17,24,31,38,45)</option>
      <option value="col-4">Col 4  (4,11,18,25,32,39,46)</option>
      <option value="col-5">Col 5  (5,12,19,26,33,40,47)</option>
      <option value="col-6">Col 6  (6,13,20,27,34,41,48)</option>
      <option value="col-7">Col 7  (7,14,21,28,35,42,49)</option>
    </optgroup>
  </select>
  <button class="btn" id="selectAllBtn">⊞ All</button>
  <div class="toolbar-sep"></div>

  <!-- Time select: auto-stop timer; value 0 means run until manually stopped -->
  <select class="row-select" id="timeSelect">
    <option value="0" selected>∞  Until stop</option>
    <option value="5000">5 s</option>
    <option value="10000">10 s</option>
    <option value="30000">30 s</option>
    <option value="60000">1 min</option>
    <option value="120000">2 min</option>
    <option value="300000">5 min</option>
    <option value="600000">10 min</option>
  </select>

  <!-- Random mode: valves cycle open/closed at random intervals -->
  <button class="btn" id="randomBtn">⇌ Random</button>
  <!-- Natural caps mode: assigns each valve a random 2–5 dL cumulative flow cap -->
  <button class="btn" id="randomCapsBtn">⧖ Natural 2–5 dL</button>
  <div class="toolbar-sep"></div>
  <div class="toolbar-sep"></div>

  <!-- Per-valve flow cap: typed in decilitres; converted to litres by the renderer -->
  <span class="toolbar-label">Cap/valve</span>
  <input type="number" id="flowCapInput" class="flow-cap-input" min="0" step="0.5" placeholder="dL" title="Cumulative flow cap per valve in decilitres">
  <div class="toolbar-sep"></div>

  <button class="btn" id="resetValvesBtn">⊘ Reset Valves</button>
  <button class="btn" id="resetTotalBtn">↺ Reset Total</button>
  <button class="btn" id="csvBtn">⬇ Export CSV</button>
  <div class="toolbar-sep"></div>

  <!-- Emergency stop: immediately halts the system, sends all-closed PDOs, and flashes the UI red -->
  <button class="btn btn-danger" id="emergencyBtn">⚠ EMERGENCY STOP</button>
</div>

<!-- MAIN LAYOUT
     Two-column grid: charts on the left, status sidebar on the right. -->
<div class="main">

  <!-- LEFT PANEL — scrollable column containing the per-valve bar chart and the live flow rate line chart -->
  <div class="left-panel">
    <div class="panel panel-label">Per-Valve Cumulative Flow</div>
    <!-- Bar chart canvas: one bar per valve showing accumulated litres since last reset -->
    <div class="panel valve-chart-wrap">
      <canvas id="valveChartCanvas"></canvas>
    </div>
    <div class="panel panel-label">Flow Rate — Live</div>
    <!-- Line chart canvas: instantaneous flow rate (L/s) derived from successive flow_history deltas -->
    <div class="panel chart-wrap">
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <!-- RIGHT SIDEBAR — total flow card, 7×7 valve grid, and mini cumulative flow sparkline -->
  <div class="sidebar">

    <!-- TOTAL FLOW CARD — large litre counter with active valve count and instantaneous L/s stats -->
    <div class="total-card">
      <div class="panel-label">Total Flow</div>
      <div class="total-value" id="totalText">0.00</div>
      <div class="total-unit">Litres accumulated</div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-value" id="activeCount">0</div>
          <div class="stat-label">Active Valves</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="flowRate">0.00</div>
          <div class="stat-label">L/s Now</div>
        </div>
      </div>
    </div>

    <!-- VALVE GRID — 7×7 interactive map; boxes are built dynamically by renderer.js -->
    <div class="valve-grid-card">
      <div class="panel-label">Valve Map — 7×7</div>
      <div class="grid-container" id="valveGrid"></div>
    </div>

    <!-- MINI CHART — compact sparkline showing cumulative total flow over time (blue, sidebar width) -->
    <div class="panel">
      <div class="panel-label">Flow History</div>
      <div class="mini-chart-wrap">
        <canvas id="totalChartCanvas"></canvas>
      </div>
    </div>

  </div>
</div>

<!-- STATUS BAR — bottom footer showing system status text, current clock time, and CAN bus indicator -->
<div class="statusbar">
  <div class="statusbar-item">
    <span id="sbStatus">System idle</span>
  </div>
  <div class="statusbar-item">
    <span id="sbTime">--:--:--</span>
  </div>
  <!-- CAN dot turns green when the main process has an active socketcan channel; red when unavailable -->
  <div class="statusbar-item">
    <span class="can-dot" id="canDot"></span>
    <span id="canStatus">CAN –</span>
  </div>
  <div class="statusbar-item">
    MEQAL v1.0  ·  Electron
  </div>
</div>

<!-- TOAST — ephemeral notification injected by renderer.js; hidden by default -->
<div id="toast"></div>

<!-- Renderer script loaded last so all DOM elements above are available immediately on execution -->
<script src="renderer.js"></script>
</body>
</html>
